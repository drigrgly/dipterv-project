# At the time this configuration works for local measurements
measurements:
  - name: short-measurement
    client:
        host: 127.0.0.1
        port: 5000
    turncat:
      log: "all:INFO"
      # Other info is gathered by the go script
    loadGenerator: 
      command: iperf
      args: ["-c", "localhost", "-p", "5000", "-u", "-i", "1", "-l", "100", "-b", "800000", "-t", "2", "-e"]
